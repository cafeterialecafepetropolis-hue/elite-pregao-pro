<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Pregão Pro | Sistema de Gestão de Licitações B2B</title>
    
    <!-- Tipografia e Biblioteca de Ícones de Alta Performance -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com"></script>

    <style>
        :root {
            --bg-principal: #090d16;
            --bg-card: #111827;
            --bg-workspace: #1f2937;
            --borda: #374151;
            
            --primaria: #3b82f6;       /* Azul Operacional */
            --sucesso: #10b981;        /* Verde Ganho */
            --alerta: #f59e0b;         /* Amarelo Análise/PNCP */
            --perigo: #ef4444;         /* Vermelho Perdido */
            
            --texto-principal: #f9fafb;
            --texto-secundario: #9ca3af;
            --texto-mutado: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- ISOLAMENTO CORPORATIVO (SaaS B2B Multi-Tenant) --- */
        aside {
            width: 260px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--borda);
            display: flex;
            flex-direction: column;
            padding: 24px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .seletor-empresa {
            background-color: #030712;
            border: 1px solid var(--borda);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .seletor-empresa select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--texto-principal);
            font-weight: 600;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .nav-links li {
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--texto-secundario);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .nav-links li:hover, .nav-links li.active {
            background-color: var(--borda);
            color: var(--texto-principal);
        }

        .usuario-info {
            border-top: 1px solid var(--borda);
            padding-top: 16px;
            font-size: 0.8rem;
        }

        /* --- CONTEÚDO OPERACIONAL --- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .container-modulo {
            padding: 24px;
            flex-grow: 1;
            overflow-y: auto;
            display: none;
        }

        .container-modulo.ativo {
            display: block;
        }

        /* Cabeçalhos */
        .header-modulo {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-modulo h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        .header-modulo p { color: var(--texto-secundario); font-size: 0.85rem; margin-top: 4px; }

        /* Filtros Regulares Indexados (Sem uso de IA para otimização de infra) */
        .painel-filtros {
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .campo-filtro label {
            display: block;
            font-size: 0.75rem;
            color: var(--texto-secundario);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .campo-filtro input, .campo-filtro select {
            width: 100%;
            background-color: var(--bg-principal);
            border: 1px solid var(--borda);
            padding: 8px;
            border-radius: 4px;
            color: var(--texto-principal);
            font-size: 0.85rem;
        }

        /* Lista de Oportunidades */
        .tabela-oportunidades {
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-radius: 8px;
            overflow: hidden;
        }

        .linha-oportunidade {
            display: grid;
            grid-template-columns: 2fr 3fr 1.5fr 1.5fr 1fr;
            padding: 16px;
            border-bottom: 1px solid var(--borda);
            align-items: center;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .linha-oportunidade:hover { background-color: rgba(255,255,255,0.02); }
        .linha-oportunidade.cabecalho { background-color: rgba(0,0,0,0.2); font-weight: 600; color: var(--texto-secundario); }

        .btn-acao {
            background-color: var(--primaria);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* --- KANBAN (FUNIL COMPLIANCE - BLOCO 6) --- */
        .quadro-kanban {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 16px;
            height: calc(100vh - 160px);
            align-items: flex-start;
        }

        .coluna-kanban {
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-radius: 8px;
            width: 280px;
            flex-shrink: 0;
            max-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .coluna-titulo {
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border-bottom: 1px solid var(--borda);
            display: flex;
            justify-content: space-between;
            background-color: rgba(0,0,0,0.1);
        }

        .coluna-cards {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .card-negocio {
            background-color: var(--bg-principal);
            border: 1px solid var(--borda);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card-negocio:hover { transform: translateY(-2px); border-color: var(--primaria); }

        /* --- WORKSPACE TUDO EM UM FLUXO (BLOCO 3) --- */
        .workspace-drawer {
            position: absolute;
            top: 0;
            right: -100%;
            width: 650px;
            height: 100vh;
            background-color: var(--bg-card);
            border-left: 2px solid var(--borda);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .workspace-drawer.aberto { right: 0; }

        .workspace-header {
            padding: 20px;
            border-bottom: 1px solid var(--borda);
            background-color: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workspace-abas {
            display: flex;
            background-color: #0d1117;
            border-bottom: 1px solid var(--borda);
        }

        .aba-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--texto-secundario);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            border-bottom: 2px solid transparent;
        }

        .aba-btn.ativa {
            color: var(--primaria);
            border-bottom-color: var(--primaria);
            background-color: var(--bg-card);
        }

        .workspace-conteudo {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .aba-painel { display: none; }
        .aba-painel.ativo { display: block; }

        .box-alerta-manual {
            background-color: rgba(245,158,11,0.05);
            border: 1px dashed var(--alerta);
            padding: 12px;
            border-radius: 6px;
            color: var(--alerta);
            margin-bottom: 16px;
            font-size: 0.8rem;
        }

        /* Utilitários */
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .badge-pncp { background-color: rgba(245,158,11,0.2); color: var(--alerta); }
