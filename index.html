<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Pregão PRO | Inteligência Máxima em Licitações</title>
    
    <!-- Fontes Premium -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ícones (Phosphor Icons) -->
    <script src="https://unpkg.com"></script>

    <style>
        :root {
            --bg-principal: #0b0f19;
            --bg-card: #131c2e;
            --bg-hover: #1c2842;
            --borda: #1e2d4a;
            
            --primaria: #2563eb;       /* Azul Tech */
            --primaria-glow: #2563eb33;
            --sucesso: #10b981;        /* Verde Lucro/Lances */
            --sucesso-glow: #10b98122;
            --alerta: #f59e0b;         /* Amarelo Atenção/IA */
            --perigo: #ef4444;         /* Vermelho Perigo/Concorrente */
            
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --texto-mutado: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- MENU LATERAL (SIDEBAR) --- */
        aside {
            width: 260px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--borda);
            display: flex;
            flex-direction: column;
            padding: 24px;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-area i {
            color: var(--primaria);
            font-size: 1.75rem;
            filter: drop-shadow(0 0 8px var(--primaria));
        }

        .logo-area span {
            color: var(--sucesso);
        }

        .menu-links {
            list-style: none;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .menu-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--texto-secundario);
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .menu-links a:hover, .menu-links li.active a {
            background-color: var(--bg-hover);
            color: var(--texto-principal);
        }

        .menu-links li.active a i {
            color: var(--primaria);
        }

        .usuario-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--borda);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primaria), var(--sucesso));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        main {
            flex-grow: 1;
            padding: 32px;
            overflow-y: auto;
            height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .titulo-pagina h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .titulo-pagina p {
            color: var(--texto-secundario);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .acoes-header {
            display: flex;
            gap: 16px;
        }

        .btn-status-robo {
            background-color: var(--sucesso-glow);
            color: var(--sucesso);
            border: 1px solid var(--sucesso);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .pulse-icon {
            width: 8px;
            height: 8px;
            background-color: var(--sucesso);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(0.9); opacity: 1; }
        }

        /* --- GRID DO DASHBOARD (O Diferencial) --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-duplo {
            grid-column: span 2;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header h2 i {
            color: var(--primaria);
            font-size: 1.25rem;
        }

        .tag-ia {
            background: linear-gradient(135deg, #7c3aed, var(--primaria));
            color: white;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Lista de Monitoramento Ativo */
        .lista-licitacoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-licitacao {
            background-color: var(--bg-principal);
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .item-licitacao:hover {
            transform: translateX(4px);
            border-color: var(--primaria);
        }

        .info-orgao h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .info-orgao p {
            font-size: 0.8rem;
            color: var(--texto-secundario);
            margin-top: 4px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge.disputa {
            background-color: var(--sucesso-glow);
            color: var(--sucesso);
        }

        /* Painel de Insights da IA Preditiva */
        .insight-box {
            background-color: #7c3aed15;
            border: 1px dashed #7c3aed44;
            border-radius: 8px;
            padding: 16px;
        }

        .insight-box h4 {
            color: #a78bfa;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .insight-box p {
            font-size: 0.85rem;
            color: var(--texto-secundario);
            line-height: 1.4;
        }

        /* Gráfico/Métricas Rápidas de Concorrentes */
        .concorrente-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--borda);
            font-size: 0.9rem;
        }

        .concorrente-row:last-child {
            border: none;
        }

        .barra-agressividade {
            width: 100px;
            height: 6px;
            background-color: var(--bg-principal);
            border-radius: 3px;
            overflow: hidden;
        }

        .barra-progresso {
            height: 100%;
            background-color: var(--perigo);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside>
        <div>
            <div class="logo-area">
                <i class="ph-bold ph-shield-checkered"></i>
                <div>Elite Pregão<span>PRO</span></div>
            </div>
            
            <ul class="menu-links">
                <li class="active"><a href="#"><i class="ph-fill ph-squares-four"></i> Painel Geral</a></li>
                <li><a href="#"><i class="ph-bold ph-radar"></i> Radar de Editais</a></li>
                <li><a href="#"><i class="ph-bold ph-robot"></i> Robô de Lances</a></li>
                <li><a href="#"><i class="ph-bold ph-chart-bar"></i> Espionagem e IA</a></li>
                <li><a href="#"><i class="ph-bold ph-gavel"></i> Recursos Jurídicos</a></li>
                <li><a href="#"><i class="ph-bold ph-gear"></i> Configurações</a></li>
            </ul>
        </div>

        <div class="usuario-status">
            <div class="avatar">EP</div>
            <div>
                <p style="font-size: 0.9rem; font-weight: 600;">Licitações LTDA</p>
